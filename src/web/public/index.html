<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cast</title>
<script>
// Applies the last-known theme/font/scale (cached by app.js — see
// applyTheme/applyFont/applyFontScale) before the first paint, so a reload
// shows the real saved look immediately instead of style.css's hardcoded
// defaults for however long the network takes, then jumping. Deliberately
// the very first thing in <head>, before any <link> — a browser defers
// script execution until every *preceding* stylesheet's CSSOM is ready, so
// this ran second-to-nothing-blocking, right after this document itself,
// with no possibility of getting stuck behind style.css's own Google Fonts
// @import (which is exactly the kind of slow external round trip this
// exists to not wait on).
try {
	const colors = JSON.parse(localStorage.getItem("cast:themeColors"));
	if (colors) {
		const root = document.documentElement.style;
		root.setProperty("--cyan", colors.accent);
		root.setProperty("--violet", colors.gradient.to);
		root.setProperty("--gradient", `linear-gradient(135deg, ${colors.gradient.from}, ${colors.gradient.to})`);
		root.setProperty("--gradient-from", colors.gradient.from);
		root.setProperty("--gradient-to", colors.gradient.to);
		root.setProperty("--teal", colors.user);
		root.setProperty("--purple", colors.agent);
		root.setProperty("--blue", colors.tool);
		root.setProperty("--green", colors.success);
		root.setProperty("--amber", colors.warning);
		root.setProperty("--rose", colors.error);
		root.setProperty("--persona", colors.persona);
		root.setProperty("--text-muted", colors.muted);
		if (colors.bg) root.setProperty("--bg", colors.bg);
		if (colors.bgSurface) root.setProperty("--bg-surface", colors.bgSurface);
		if (colors.bgRaised) root.setProperty("--bg-raised", colors.bgRaised);
		if (colors.bgHover) root.setProperty("--bg-hover", colors.bgHover);
		if (colors.border) root.setProperty("--border", colors.border);
		if (colors.borderActive) root.setProperty("--border-active", colors.borderActive);
	}
} catch {}
// Same idea for a picked font/scale (Settings > Font in app.js) — both are
// pure client prefs (no server round trip at all), so nothing else needs to
// resolve first; apply straight from cache before paint.
try {
	const fontId = localStorage.getItem("cast:fontId");
	if (fontId && fontId !== "jetbrains-mono") {
		// [family, isMonospace] — isMonospace decides whether --font-mono (code
		// blocks, tool output, tables, the ASCII banner) follows the pick too;
		// a sans-serif family only ever changes --font. Keep in sync with
		// FONT_OPTIONS in app.js.
		const families = {
			"fira-code": ["'Fira Code', 'JetBrains Mono', monospace", true],
			"ibm-plex-mono": ["'IBM Plex Mono', monospace", true],
			"jetbrains-mono": ["'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace", true],
			"ibm-plex-sans": ["'IBM Plex Sans', sans-serif", false],
			"inter": ["'Inter', sans-serif", false],
			"work-sans": ["'Work Sans', sans-serif", false],
		};
		const picked = families[fontId];
		if (picked) {
			const [family, isMonospace] = picked;
			document.documentElement.style.setProperty("--font", family);
			if (isMonospace) document.documentElement.style.setProperty("--font-mono", family);
		}
	}
	const fontScale = localStorage.getItem("cast:fontScale");
	if (fontScale) document.documentElement.style.setProperty("--font-scale", fontScale);
} catch {}
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/chat.css">
<link rel="stylesheet" href="/tools.css">
<link rel="stylesheet" href="/workspace.css">
<link rel="stylesheet" href="/settings.css">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{
	"imports": {
		"preact": "/vendor/preact.mjs",
		"preact/hooks": "/vendor/preact-hooks.mjs",
		"htm": "/vendor/htm.mjs"
	}
}
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
