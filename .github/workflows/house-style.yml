name: house style

# The house standard, enforced.
#
# The checker is not vendored into this repository. It is pulled from
# aa-blinov/golden-repo at a pinned version, so that an improvement to the
# standard reaches every repository that adopts it without a pull request
# here.
#
# Dependabot reads this reference as a dependency and opens the pull request
# that bumps the pin. That is the whole update mechanism: the standard can
# change without turning the CI of every dependent repository red, and every
# repository says which version it follows because the version is in this
# file.

on:
  # Every branch, because the default branch of a repository in this
  # collection is not always main: most are on master, and one is on prod.
  # A filter on main would mean the check never ran.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: house-style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  housecheck:
    name: House style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: aa-blinov/golden-repo/.github/actions/house-style@v1.0.12
        with:
          report: house-style.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: house-style-report
          path: house-style.json
