name: Deploy docs to Pages

on:
  push:
    branches: [master]
    paths:
      - docs/**
      - scripts/build-site.mjs
      - install.sh
      - install.ps1
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. A newer push cancels any in-flight or
# queued deploy (cancel-in-progress: true) so a stuck/queued run can't block
# the latest docs forever — we always want only the most recent commit live,
# and a half-replaced deploy is self-healing on the next push.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install marked
        run: npm install --ignore-scripts marked highlight.js

      - name: Build site
        run: node --import tsx scripts/build-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
