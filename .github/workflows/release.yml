name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Type check + lint
        run: npm run check

      # Build must run before tests because the interactive end-to-end tests
      # spawn the bundled dist/index.js.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            format: tar.gz
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            format: tar.gz
          - target: darwin-x64
            runner: macos-15-intel
            format: tar.gz
          - target: darwin-arm64
            runner: macos-14
            format: tar.gz
          - target: win32-x64
            runner: windows-2022
            format: zip
          - target: win32-arm64
            runner: windows-11-arm
            format: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage release
        shell: bash
        if: matrix.format == 'tar.gz'
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          stage="$RUNNER_TEMP/cast"
          node scripts/package-release.mjs --target "${{ matrix.target }}" --stage "$stage"
          mkdir -p out
          tar -C "$RUNNER_TEMP" -czf "out/cast-${version}-${{ matrix.target }}.tar.gz" cast

      - name: Stage release (Windows)
        if: matrix.format == 'zip'
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $stage = Join-Path $env:RUNNER_TEMP "cast"
          node scripts/package-release.mjs --target "${{ matrix.target }}" --stage $stage
          New-Item -ItemType Directory -Path out -Force | Out-Null
          Push-Location $env:RUNNER_TEMP
          Compress-Archive -Path cast -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "out/cast-$version-${{ matrix.target }}.zip") -Force
          Pop-Location

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: cast-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cast-*
          merge-multiple: true
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: out/*
