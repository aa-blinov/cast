name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # Same gate as CI (see ci.yml) — a broken tag shouldn't ship. Tags
      # aren't guaranteed to have already gone through CI (e.g. tagging an
      # older commit), so this can't be skipped.
      - name: Type check + lint
        run: npm run check

      # Build must run *before* tests because test/run-interactive-command.test.ts
      # and test/worktree-from-worktree.test.ts spawn the bundled
      # `dist/index.js` to exercise `cast run --interactive` end-to-end.
      # Without this step the spawn fails with `MODULE_NOT_FOUND` and
      # the release job aborts before the bundle can be packaged.
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Package release archives
        id: package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="$(mktemp -d)/cast"
          mkdir -p "$STAGE"
          cp -r dist "$STAGE/"
          cp -r prompts "$STAGE/"
          cp -r bin "$STAGE/"
          mkdir -p "$STAGE/node_modules"
          cp -r node_modules/node-pty node_modules/node-addon-api "$STAGE/node_modules/"
          cp package.json README.md "$STAGE/"
          chmod +x "$STAGE/bin/cast"

          mkdir -p out
          tar -C "$(dirname "$STAGE")" -czf "out/cast-${VERSION}.tar.gz" cast
          (cd "$(dirname "$STAGE")" && zip -rq "$OLDPWD/out/cast-${VERSION}.zip" cast)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/cast-${{ steps.package.outputs.version }}.tar.gz
            out/cast-${{ steps.package.outputs.version }}.zip
