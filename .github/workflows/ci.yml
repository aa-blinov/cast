name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check + lint
        run: npm run check

      - name: Build
        # Tests in test/run-interactive-command.test.ts and
        # test/worktree-from-worktree.test.ts spawn the bundled
        # `dist/index.js` to exercise `cast run --interactive` end-to-end.
        # Without this step CI's `npm ci` leaves dist/ empty and those
        # tests fail with `Cannot find module 'dist/index.js'`.
        run: npm run build

      - name: Run tests
        # CAST_SESSIONS_DB points at a tmpdir file so the
        # AgentActorRegistry singleton's watchdog timer (set up by
        # test/web-bridge.test.ts via src/core/actors.ts) has a safe
        # path to land on if it fires after the test that started it
        # has finished — src/core/db.ts's safety guard otherwise throws
        # when a fire-and-forget background task outlives the test.
        env:
          CAST_SESSIONS_DB: ${{ runner.temp }}/cast-ci-sessions-${{ github.run_id }}.db
        run: npm test

      - name: Coverage + per-file floor
        # Runs the vitest suite with v8 coverage, then checks every
        # tracked file in coverage-baseline.json against its committed
        # line-coverage floor. Global thresholds (lines 70 / branches
        # 75 / functions 85) live in vitest.config.ts; the per-file
        # floors that catch "one module quietly lost 20pp" live in
        # coverage-baseline.json and ratchet up only when someone
        # commits tests that raise them. See scripts/check-coverage-
        # floor.mjs and scripts/sync-coverage-baseline.mjs.
        run: |
          npm run coverage
          npm run coverage:check
