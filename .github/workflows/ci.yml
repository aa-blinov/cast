name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check + lint
        run: npm run check

      - name: Build
        # Tests in test/run-interactive-command.test.ts and
        # test/worktree-from-worktree.test.ts spawn the bundled
        # `dist/index.js` to exercise `cast run --interactive` end-to-end.
        # Without this step CI's `npm ci` leaves dist/ empty and those
        # tests fail with `Cannot find module 'dist/index.js'`.
        run: npm run build

      - name: Run tests
        run: npm test
